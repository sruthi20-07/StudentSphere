<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>
      Sruthi Student Services | Resume, Projects & Counselling Help
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Helping students with resumes, projects, counselling, scholarship applications, portfolio websites, React projects, Firebase projects and career support."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="resume building, student services, portfolio websites, React projects, Firebase projects, EAMCET counselling, scholarship applications, career support, ATS resume, mini projects, LinkedIn profile setup, internship applications, form filling services, student help center, UI UX design, project reports"
    />

    <!-- Author -->
    <meta name="author" content="Sruthi Student Services" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Sruthi Student Services"
    />

    <meta
      property="og:description"
      content="Helping students with resumes, projects, counselling, applications, portfolio websites and career support."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://student-sphere-one.vercel.app/"
    />

    <meta
      property="og:image"
      content="/favicon.svg"
    />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Sruthi Student Services"
    />

    <meta
      name="twitter:description"
      content="Student help center for resumes, projects, counselling and career support."
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#8b5cf6" />
